name: Importar Arete v10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-arete-final.yml'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e importar Arete v10
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_{00..12} > /tmp/arete-stage.b64
          base64 -d /tmp/arete-stage.b64 > /tmp/arete-stage.tar.gz
          tar -tzf /tmp/arete-stage.tar.gz >/dev/null
          rm -rf .bootstrap
          tar -xzf /tmp/arete-stage.tar.gz -C .
          rm -f .github/workflows/import-arete.yml
          rm -f .github/workflows/import-arete-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: importar Arete v10 pre-pagamentos'
          git push origin HEAD:main
