name: Inspecionar pacote parcial Arete v10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-arete-final.yml'

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar tar parcial valido
        shell: bash
        run: |
          set +e
          cat \
            .bootstrap/part_00 \
            .stage/part_01 \
            .stage/part_02 \
            .stage/part_03 \
            .stage/part_04 \
            .bootstrap/part_05 \
            .bootstrap/part_06 > /tmp/prefix.b64
          base64 -d /tmp/prefix.b64 > /tmp/prefix.tar.gz
          echo '=== TAMANHOS ==='
          wc -c /tmp/prefix.b64 /tmp/prefix.tar.gz
          echo '=== PRIMEIRAS ENTRADAS DO TAR ==='
          gzip -dc /tmp/prefix.tar.gz 2>/tmp/gzip.err | tar -tvf - 2>/tmp/tar.err | head -80
          echo '=== GZIP ==='
          cat /tmp/gzip.err
          echo '=== TAR ==='
          cat /tmp/tar.err
          exit 1
