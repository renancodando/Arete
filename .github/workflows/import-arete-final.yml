name: Importar Arete v10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-arete-final.yml'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar e importar Arete v10
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 'https://arete-import-temp.vercel.app/arete-stage.tar.gz' -o /tmp/arete-stage.tar.gz
          tar -tzf /tmp/arete-stage.tar.gz >/dev/null
          rm -rf .bootstrap
          tar -xzf /tmp/arete-stage.tar.gz -C .
          rm -f .github/workflows/import-arete.yml
          rm -f .github/workflows/import-arete-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao para publicar.'
            exit 1
          fi
          git commit -m 'feat: importar Arete v10 pre-pagamentos'
          git push origin HEAD:main
