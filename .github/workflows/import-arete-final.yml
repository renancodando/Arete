name: Finalizar importacao Arete v10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-arete-final.yml'

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir, validar e publicar Arete v10
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .bootstrap/part_00 \
            .stage/part_01 \
            .stage/part_02 \
            .stage/part_03 \
            .stage/part_04 \
            .bootstrap/part_05 \
            .bootstrap/part_06 \
            .stage/part_07 \
            .bootstrap/part_08 \
            .bootstrap/part_09 \
            .bootstrap/part_10 \
            .stage/part_11 \
            .stage/part_12 \
            .stage/part_13 \
            .stage/part_14 \
            .stage/part_15 \
            .stage/part_16 > /tmp/arete-stage.b64

          base64 -d /tmp/arete-stage.b64 > /tmp/arete-stage.tar.gz
          gzip -t /tmp/arete-stage.tar.gz
          echo "Arquivos no pacote: $(tar -tzf /tmp/arete-stage.tar.gz | wc -l)"

          rm -rf .bootstrap .stage
          tar -xzf /tmp/arete-stage.tar.gz -C .

          rm -f .github/workflows/import-arete.yml
          rm -f .github/workflows/import-arete-final.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: importar Arete v10 pre-pagamentos'
          git push origin HEAD:main
