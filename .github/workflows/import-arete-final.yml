name: Diagnosticar bootstrap Arete v10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-arete-final.yml'

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnosticar partes
        shell: bash
        run: |
          set -u
          for f in .bootstrap/part_{00..12}; do
            echo "=== $f ==="
            wc -c < "$f"
            printf 'inicio='; head -c 24 "$f"; echo
            printf 'fim='; tail -c 24 "$f"; echo
            printf 'padding='; grep -o '=' "$f" | wc -l || true
            if LC_ALL=C grep -q '[^A-Za-z0-9+/=]' "$f"; then echo 'chars=INVALIDOS'; else echo 'chars=base64'; fi
          done
          echo '=== testes incrementais ==='
          : > /tmp/join.b64
          for n in $(seq -w 0 12); do
            cat ".bootstrap/part_$n" >> /tmp/join.b64
            if base64 -d /tmp/join.b64 > /tmp/test.bin 2>/tmp/b64.err; then
              if gzip -t /tmp/test.bin 2>/tmp/gz.err; then
                echo "ate_$n=BASE64_OK_GZIP_OK"
              else
                echo "ate_$n=BASE64_OK_GZIP_INCOMPLETO"
              fi
            else
              echo "ate_$n=BASE64_INVALIDO $(tr '\n' ' ' </tmp/b64.err)"
            fi
          done
          exit 1
